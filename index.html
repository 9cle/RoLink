<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoLink - Roblox Verification</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }
    header { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px 0; }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    header span { font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; text-align: center; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .status-box { background-color: #0f172a; border: 1px solid #16a34a; border-radius: 10px; padding: 16px; color: #4ade80; margin-top: 15px; font-size: 14px; }
    .code-box { background: #090d16; border: 1px dashed #00a2ff; padding: 12px; border-radius: 8px; font-family: monospace; color: #00a2ff; margin-top: 15px; font-size: 16px; user-select: all; cursor: pointer; }
    p { color: #94a3b8; font-size: 14px; margin-top: 15px; }
    .add-bot-btn { display: inline-block; width: 100%; margin-top: 20px; padding: 12px 16px; background-color: #5865f2; color: #ffffff; font-weight: 600; font-size: 14px; border-radius: 8px; text-decoration: none; transition: background-color 0.2s; }
    .add-bot-btn:hover { background-color: #4752c4; }
    footer { margin-top: 24px; text-align: center; padding-bottom: 10px; }
    footer a { color: #64748b; font-size: 13px; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: #38bdf8; text-decoration: underline; }
    .copyright { color: #475569; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <img src="favicon.ico" alt="RoLink Logo" />
    <span>RoLink</span>
  </header>

  <main>
    <div class="card">
      <h1>RoLink Verification</h1>
      <div id="status-box" class="status-box">
        <span id="status">Processing OAuth parameter...</span>
      </div>
      <div id="action-area" style="display: none;">
        <p>Copy the command below and paste it into Discord:</p>
        <div id="cmd-box" class="code-box"></div>
      </div>
      <a href="https://discord.com/oauth2/authorize?client_id=1538132611225092126&permissions=8&integration_type=0&scope=bot" target="_blank" class="add-bot-btn">Add Bot to Discord Server</a>
    </div>
  </main>

  <footer>
    <a href="safety.html">How we handle safety</a>
    <div class="copyright">© 2026 RoLink. All rights reserved.</div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      document.getElementById('status').innerText = '✅ Authorization Code Received!';
      document.getElementById('action-area').style.display = 'block';
      document.getElementById('cmd-box').innerText = `/complete code:${code}`;
    } else {
      document.getElementById('status-box').style.borderColor = '#dc2626';
      document.getElementById('status').style.color = '#f87171';
      document.getElementById('status').innerText = '❌ Missing code. Please start verification from Discord using /verify.';
    }
  </script>
</body>
</html>
